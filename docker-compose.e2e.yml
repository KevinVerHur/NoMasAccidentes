services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: no_mas_accidentes_e2e
      MYSQL_USER: nma_user
      MYSQL_PASSWORD: cambiar_password_local
      MYSQL_ROOT_PASSWORD: root_password_e2e
      TZ: America/Santiago
    ports:
      - "3307:3306"
    volumes:
      - mysql_e2e_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  backend:
    build:
      context: ./Producto/Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/no_mas_accidentes_e2e?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: nma_user
      SPRING_DATASOURCE_PASSWORD: cambiar_password_local
      JWT_SECRET: test-secret-key-cambiar-en-produccion-minimo-256-bits-de-largo-11234567890
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_USER: dev@nma.local
      MAIL_PASS:
      SMTP_AUTH: "false"
      SMTP_STARTTLS: "false"
      APP_FRONTEND_URL: http://127.0.0.1:5173
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./Producto/Frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://127.0.0.1:8080
    ports:
      - "5173:5173"

volumes:
  mysql_e2e_data:
