services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: no_mas_accidentes_e2e
      MYSQL_USER: nma_user
      MYSQL_PASSWORD: cambiar_password_local
      MYSQL_ROOT_PASSWORD: root_password_e2e
      TZ: America/Santiago
    ports:
      - "3307:3306"
    volumes:
      - mysql_e2e_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"

  frontend:
    build:
      context: ./Producto/Frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8080
    ports:
      - "5173:5173"

volumes:
  mysql_e2e_data:
