# Perfil test de runtime para Selenium/Docker.
# Los tests unitarios de Maven siguen usando src/test/resources/application-test.properties con H2 en memoria.
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/no_mas_accidentes_e2e?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USER:nma_user}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASS:cambiar_password_local}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

jwt.secret=${JWT_SECRET:test-secret-key-cambiar-en-produccion-minimo-256-bits-de-largo-11234567890}
jwt.expiration=3600000

spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USER:dev@nma.local}
spring.mail.password=${MAIL_PASS:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}

app.frontend-url=${APP_FRONTEND_URL:http://127.0.0.1:5173}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
